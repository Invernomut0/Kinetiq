# Builds, signs and publishes Kinetiq-<version>.dmg when a v* tag is pushed.
#
# Signing uses the Apple Development identity stored in the SIGNING_CERT_P12 (base64 .p12)
# and SIGNING_CERT_PASSWORD secrets. Without them the app is signed ad-hoc.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: Kinetiq

      - name: Read reviewed core SDK pin
        id: telemetry-sdk-pin
        working-directory: Kinetiq
        run: |
          PIN="$(cat Documentation/telemetry-sdk-revision.txt)"
          [[ "$PIN" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid TelemetrySDK pin.'; exit 1; }
          echo "revision=$PIN" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          repository: Invernomut0/TelemetrySDK
          ref: ${{ steps.telemetry-sdk-pin.outputs.revision }}
          path: TelemetrySDK
          persist-credentials: false

      - name: Verify sibling core SDK and offline parser gates
        working-directory: Kinetiq
        run: |
          bash scripts/verify-telemetry-sdk.sh
          python3 -m unittest discover -s scripts -p test_telemetry_config.py -v
          python3 -m unittest discover -s scripts -p test_ga4_config.py -v
          python3 -m unittest discover -s scripts -p test_firebase_signing.py -v
          swift test --package-path ../TelemetrySDK

      - name: Test
        working-directory: Kinetiq
        run: swift test

      - name: Import signing certificate
        if: env.SIGNING_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Set version from tag
        working-directory: Kinetiq
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist

      - name: Build app
        working-directory: Kinetiq
        run: |
          scripts/build-app.sh
          lipo -archs build/Kinetiq.app/Contents/MacOS/Kinetiq
          if [ -n "$SIGNING_CERT_P12" ]; then
            codesign -dvv build/Kinetiq.app 2>&1 | grep -q "Authority=Apple Development" \
              || { echo "::error::App was not signed with the Apple Development identity"; exit 1; }
          fi
            codesign --verify --deep --strict build/Kinetiq.app
            codesign --verify --deep --strict build/Kinetiq.app/Contents/Resources/Kinetiq.saver
            python3 scripts/verify-telemetry-bundle.py

      - name: Create DMG
        working-directory: Kinetiq
        run: |
          STAGING="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGING"
          cp -R build/Kinetiq.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname Kinetiq -srcfolder "$STAGING" -ov -format UDZO "build/Kinetiq-$VERSION.dmg"

      - name: Publish release
        working-directory: Kinetiq
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/Kinetiq-$VERSION.dmg" \
            --title "Kinetiq $VERSION" --generate-notes

      - name: Remove signing keychain
        if: always() && env.SIGNING_CERT_P12 != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
